name: Compilar WClient APK

on:
  push:
    branches: [ "main", "freebuff/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK ⚡
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Instalar Java 8 (via apt, para toolchain do relay)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-8-jdk 2>&1 | tail -3

      - name: 🏗️ Configurar Android SDK (pré-instalado)
        run: |
          ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: 🚀 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Compilar APK Debug
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --parallel --configure-on-demand \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.parallel=true \
            --max-workers=4 \
            --build-cache

      - name: 🔨 Compilar APK Release
        run: |
          ./gradlew :app:assembleRelease --parallel --configure-on-demand \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.parallel=true \
            --max-workers=4 \
            --build-cache

      - name: 📋 Listar APKs gerados
        run: |
          echo "✅ APKs compilados com sucesso!"
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: 📦 Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: WClient-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: 📦 Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: WClient-Release-APK
          path: app/build/outputs/apk/release/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: 🚀 Criar Release no GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: WClient v${{ github.run_number }}
          body: |
            ## WClient APK Build #${{ github.run_number }}
            
            ### Alterações
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            
            ### Arquivos
            - **WClient-Debug.apk** — Para instalação e teste
            - **WClient-Release.apk** — Versão otimizada para produção
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
